<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>douhuo_picker architecture</title>
  <desc>Excel task sheet to Python client to in-page fetch to API to result sheet end-to-end flow</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="32" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#1D1F27">douhuo_picker end-to-end flow</text>
  <text x="340" y="52" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#5F5E5A">Excel driven · reverse-engineered API · persistent login</text>
  <rect x="50" y="100" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="135" y="120" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#633806">User fills task sheet</text>
  <text x="135" y="140" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#854F0B">keyword / cat / brand / price</text>
  <rect x="260" y="100" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="345" y="120" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">openpyxl reader</text>
  <text x="345" y="140" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5">store.py · parse / validate</text>
  <rect x="470" y="100" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="555" y="120" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">Playwright Chromium</text>
  <text x="555" y="140" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">persistent profile / cookie</text>
  <rect x="150" y="210" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="250" y="230" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">In-page fetch</text>
  <text x="250" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">uses front-end API path</text>
  <rect x="380" y="210" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="230" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#712B13">Real mall API</text>
  <text x="480" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#993C1D">/manager/Choice/*</text>
  <rect x="50" y="320" width="170" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="135" y="340" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#27500A">Normalize &amp; sort</text>
  <text x="135" y="360" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#3B6D11">flat fields · local re-sort</text>
  <rect x="260" y="320" width="170" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="345" y="340" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#72243E">Dedup &amp; write</text>
  <text x="345" y="360" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#993556">dual-key · auto backup</text>
  <rect x="470" y="320" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="555" y="340" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#633806">Human in Excel</text>
  <text x="555" y="360" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#854F0B">status / hits / link</text>
  <line x1="220" y1="128" x2="260" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="128" x2="470" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="156" x2="555" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="238" x2="350" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="266" x2="250" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="348" x2="260" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="348" x2="470" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="135" y1="376" x2="135" y2="420" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arr)"/>
  <text x="135" y="436" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:#5F5E5A">errors / empty → status reflected in task sheet</text>
</svg>
