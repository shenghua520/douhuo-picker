name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build dummy workbook with headers only
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          wb = Workbook()
          ws = wb.active
          ws.title = "选品清单"
          ws.append(["品类", "品牌", "规格", "备注"])
          for cat in ("铅笔", "作业本", "橡皮擦"):
              ws.append([cat, "", "", ""])
          Path("examples").mkdir(exist_ok=True)
          wb.save("examples/template.xlsx")
          print("wrote examples/template.xlsx")
          PY

      - name: Dry-run task derivation
        working-directory: douhuo_picker
        run: |
          python run.py --excel ../examples/template.xlsx --init --dry-run

      - name: Verify picker CLI help
        working-directory: douhuo_picker
        run: python run.py --help

      - name: Verify scraper CLI help
        working-directory: douhuo_scraper
        run: python run.py --help
